<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in · los</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100dvh; padding: 16px; }
    .login { width: 100%; max-width: 380px; display: grid; gap: 22px; animation: rise .25s ease-out; }
    .login .brand { justify-content: center; font-size: 26px; padding: 0; }
    .login .mark { width: 34px; height: 34px; }
    .login form { display: grid; gap: 14px; padding: 26px 24px 24px; }
    .login h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
    .login .sub { margin: -8px 0 4px; color: var(--muted); font-size: 13.5px; }
    .login .input { height: 42px; font-size: 15px; }
    .login .btn { height: 42px; font-size: 14.5px; }
    .remember { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
    .remember input { width: 16px; height: 16px; accent-color: var(--accent); }
    .foot { text-align: center; font-size: 12.5px; color: var(--faint); }
  </style>
  <script src="/theme.js"></script>
</head>
<body>
  <main class="login">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" class="mark-bg"/><path d="M16 1h8a7 7 0 0 1 7 7v16a7 7 0 0 1-7 7h-8z" class="mark-red"/></svg>
      <span>los</span>
    </div>
    <form class="card" method="post" action="/login">
      <h1>Log in</h1>
      <p class="sub">Your personal assistant is waiting.</p>
      <!--ERROR-->
      <input type="hidden" name="next" value="<!--NEXT-->">
      <label class="field">Username<input class="input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus value="<!--USER-->"></label>
      <label class="field">Password<input class="input" name="password" type="password" autocomplete="current-password" required></label>
      <label class="remember"><input type="checkbox" name="remember" value="1" checked>Keep me logged in for 30 days</label>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <div class="foot"><!--HOST--></div>
  </main>
</body>
</html>
